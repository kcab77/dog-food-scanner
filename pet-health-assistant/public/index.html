<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pet Health Assistant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; height: 100vh; display: flex; flex-direction: column; }

  /* Header */
  .header { background: #2d6a4f; color: white; padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header .paw { font-size: 22px; }

  /* Layout */
  .layout { display: flex; flex: 1; overflow: hidden; }

  /* Sidebar */
  .sidebar { width: 240px; background: white; border-right: 1px solid #e5e5e5; display: flex; flex-direction: column; }
  .sidebar-header { padding: 16px; border-bottom: 1px solid #e5e5e5; }
  .sidebar-header h2 { font-size: 13px; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
  .btn-add { width: 100%; padding: 8px; background: #2d6a4f; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 500; }
  .btn-add:hover { background: #235c43; }

  .pet-list { flex: 1; overflow-y: auto; padding: 8px; }
  .pet-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; margin-bottom: 2px; transition: background 0.15s; }
  .pet-item:hover { background: #f0f0ea; }
  .pet-item.active { background: #e8f4ee; }
  .pet-avatar { width: 36px; height: 36px; border-radius: 50%; background: #2d6a4f; color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0; }
  .pet-info .pet-name { font-size: 14px; font-weight: 600; color: #222; }
  .pet-info .pet-species { font-size: 12px; color: #888; }

  /* Main */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* Empty state */
  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #888; gap: 12px; }
  .empty-state .icon { font-size: 48px; }
  .empty-state h3 { font-size: 18px; color: #444; }
  .empty-state p { font-size: 14px; text-align: center; max-width: 280px; line-height: 1.5; }

  /* Chat header */
  .chat-header { padding: 14px 20px; background: white; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: space-between; }
  .chat-header-left { display: flex; align-items: center; gap: 12px; }
  .chat-pet-avatar { width: 38px; height: 38px; border-radius: 50%; background: #2d6a4f; color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; }
  .chat-pet-name { font-size: 16px; font-weight: 600; color: #222; }
  .chat-pet-detail { font-size: 12px; color: #888; }
  .chat-actions { display: flex; gap: 8px; }
  .btn-icon { padding: 6px 12px; border: 1px solid #ddd; background: white; border-radius: 6px; font-size: 12px; cursor: pointer; color: #555; }
  .btn-icon:hover { background: #f5f5f5; }

  /* Messages */
  .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .message { display: flex; gap: 10px; max-width: 85%; }
  .message.user { align-self: flex-end; flex-direction: row-reverse; }
  .message.assistant { align-self: flex-start; }
  .msg-avatar { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .message.assistant .msg-avatar { background: #2d6a4f; color: white; }
  .message.user .msg-avatar { background: #e5e5e5; }
  .msg-bubble { padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.6; }
  .message.assistant .msg-bubble { background: white; color: #222; border: 1px solid #e5e5e5; border-bottom-left-radius: 4px; }
  .message.user .msg-bubble { background: #2d6a4f; color: white; border-bottom-right-radius: 4px; }
  .typing { display: flex; gap: 4px; align-items: center; padding: 12px 14px; }
  .typing span { width: 7px; height: 7px; background: #aaa; border-radius: 50%; animation: bounce 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

  /* Input */
  .input-area { padding: 16px 20px; background: white; border-top: 1px solid #e5e5e5; display: flex; gap: 10px; }
  .input-area textarea { flex: 1; border: 1px solid #ddd; border-radius: 12px; padding: 10px 14px; font-size: 14px; resize: none; height: 44px; max-height: 120px; font-family: inherit; outline: none; transition: border 0.15s; }
  .input-area textarea:focus { border-color: #2d6a4f; }
  .btn-send { padding: 0 18px; background: #2d6a4f; color: white; border: none; border-radius: 12px; font-size: 14px; cursor: pointer; font-weight: 500; height: 44px; }
  .btn-send:hover { background: #235c43; }
  .btn-send:disabled { background: #aaa; cursor: not-allowed; }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal-overlay.hidden { display: none; }
  .modal { background: white; border-radius: 16px; padding: 28px; width: 480px; max-width: 95vw; max-height: 90vh; overflow-y: auto; }
  .modal h2 { font-size: 20px; font-weight: 700; margin-bottom: 20px; color: #222; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 13px; font-weight: 500; color: #555; margin-bottom: 5px; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #2d6a4f; }
  .form-group textarea { height: 70px; resize: none; }
  .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
  .btn-primary { flex: 1; padding: 10px; background: #2d6a4f; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-primary:hover { background: #235c43; }
  .btn-secondary { padding: 10px 18px; border: 1px solid #ddd; background: white; border-radius: 8px; font-size: 14px; cursor: pointer; color: #555; }
  .btn-secondary:hover { background: #f5f5f5; }
</style>
</head>
<body>

<div class="header">
  <span class="paw">🐾</span>
  <h1>Pet Health Assistant</h1>
</div>

<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>My Pets</h2>
      <button class="btn-add" onclick="openAddPet()">+ Add Pet</button>
    </div>
    <div class="pet-list" id="petList"></div>
  </div>

  <!-- Main -->
  <div class="main" id="main">
    <div class="empty-state" id="emptyState">
      <div class="icon">🐶</div>
      <h3>Welcome!</h3>
      <p>Add your pet's profile and start asking questions about their health, supplements, and wellness.</p>
    </div>

    <!-- Chat (hidden until pet selected) -->
    <div id="chatView" style="display:none; flex:1; display:none; flex-direction:column; overflow:hidden;">
      <div class="chat-header">
        <div class="chat-header-left">
          <div class="chat-pet-avatar" id="chatAvatar"></div>
          <div>
            <div class="chat-pet-name" id="chatName"></div>
            <div class="chat-pet-detail" id="chatDetail"></div>
          </div>
        </div>
        <div class="chat-actions">
          <button class="btn-icon" onclick="editCurrentPet()">Edit Profile</button>
          <button class="btn-icon" onclick="clearChat()">Clear Chat</button>
        </div>
      </div>
      <div class="messages" id="messages"></div>
      <div class="input-area">
        <textarea id="input" placeholder="Ask anything about your pet..." onkeydown="handleKey(event)"></textarea>
        <button class="btn-send" id="sendBtn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Pet Modal -->
<div class="modal-overlay hidden" id="petModal">
  <div class="modal">
    <h2 id="modalTitle">Add Your Pet</h2>
    <div class="form-row">
      <div class="form-group">
        <label>Pet Name *</label>
        <input type="text" id="f-name" placeholder="e.g. Hershey">
      </div>
      <div class="form-group">
        <label>Species *</label>
        <select id="f-species">
          <option value="Dog">Dog</option>
          <option value="Cat">Cat</option>
          <option value="Other">Other</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Breed</label>
        <input type="text" id="f-breed" placeholder="e.g. Golden Retriever">
      </div>
      <div class="form-group">
        <label>Age</label>
        <input type="text" id="f-age" placeholder="e.g. 7 years">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Weight (lbs)</label>
        <input type="number" id="f-weight" placeholder="e.g. 75">
      </div>
      <div class="form-group">
        <label>Sex</label>
        <select id="f-sex">
          <option value="">Unknown</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Male (neutered)">Male (neutered)</option>
          <option value="Female (spayed)">Female (spayed)</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Health Conditions</label>
      <input type="text" id="f-conditions" placeholder="e.g. lipomas, allergies, arthritis">
    </div>
    <div class="form-group">
      <label>Current Medications</label>
      <input type="text" id="f-medications" placeholder="e.g. Heartgard monthly">
    </div>
    <div class="form-group">
      <label>Current Supplements</label>
      <textarea id="f-supplements" placeholder="e.g. The Resistance 1 tsp daily, Four Leaf Rover Liver & Kidney Clean, manuka honey on gums"></textarea>
    </div>
    <div class="form-group">
      <label>Diet</label>
      <input type="text" id="f-diet" placeholder="e.g. raw, kibble, fresh food">
    </div>
    <div class="form-group">
      <label>Notes</label>
      <textarea id="f-notes" placeholder="e.g. loves to swim, sensitive stomach, lives in tick-heavy area"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="savePet()">Save Pet</button>
    </div>
  </div>
</div>

<script>
let pets = [];
let currentPetId = null;
let editingPetId = null;
let isStreaming = false;

async function loadPets() {
  const res = await fetch('/api/pets');
  pets = await res.json();
  renderPetList();
  if (pets.length > 0 && !currentPetId) selectPet(pets[0].petId);
}

function renderPetList() {
  const list = document.getElementById('petList');
  list.innerHTML = pets.map(p => `
    <div class="pet-item ${p.petId === currentPetId ? 'active' : ''}" onclick="selectPet('${p.petId}')">
      <div class="pet-avatar">${p.name[0].toUpperCase()}</div>
      <div class="pet-info">
        <div class="pet-name">${p.name}</div>
        <div class="pet-species">${p.species}${p.weight ? ' · ' + p.weight + ' lbs' : ''}</div>
      </div>
    </div>
  `).join('');
}

async function selectPet(petId) {
  currentPetId = petId;
  const pet = pets.find(p => p.petId === petId);
  renderPetList();

  document.getElementById('emptyState').style.display = 'none';
  const chatView = document.getElementById('chatView');
  chatView.style.display = 'flex';
  chatView.style.flexDirection = 'column';
  chatView.style.overflow = 'hidden';
  chatView.style.flex = '1';

  document.getElementById('chatAvatar').textContent = pet.name[0].toUpperCase();
  document.getElementById('chatName').textContent = pet.name;
  document.getElementById('chatDetail').textContent = [pet.species, pet.breed, pet.age ? pet.age + ' old' : '', pet.weight ? pet.weight + ' lbs' : ''].filter(Boolean).join(' · ');

  await loadChatHistory(petId);
}

async function loadChatHistory(petId) {
  const res = await fetch(`/api/pets/${petId}/chat`);
  const messages = await res.json();
  const container = document.getElementById('messages');
  container.innerHTML = '';

  if (messages.length === 0) {
    const pet = pets.find(p => p.petId === petId);
    appendMessage('assistant', `Hi! I'm here to help with any questions about ${pet.name}. I have their full profile loaded — feel free to ask about supplements, ingredients, health concerns, or anything else!`);
    return;
  }

  messages.forEach(m => appendMessage(m.role, m.content));
  container.scrollTop = container.scrollHeight;
}

function appendMessage(role, content) {
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `message ${role}`;
  div.innerHTML = `
    <div class="msg-avatar">${role === 'assistant' ? '🐾' : '👤'}</div>
    <div class="msg-bubble">${escapeHtml(content).replace(/\n/g, '<br>')}</div>
  `;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return div;
}

function showTyping() {
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'message assistant';
  div.id = 'typing-indicator';
  div.innerHTML = `<div class="msg-avatar">🐾</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

async function sendMessage() {
  if (isStreaming || !currentPetId) return;
  const input = document.getElementById('input');
  const message = input.value.trim();
  if (!message) return;

  input.value = '';
  input.style.height = '44px';
  isStreaming = true;
  document.getElementById('sendBtn').disabled = true;

  appendMessage('user', message);
  showTyping();

  const res = await fetch(`/api/pets/${currentPetId}/chat`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message }),
  });

  removeTyping();

  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'message assistant';
  div.innerHTML = `<div class="msg-avatar">🐾</div><div class="msg-bubble" id="streaming-bubble"></div>`;
  container.appendChild(div);

  const bubble = document.getElementById('streaming-bubble');
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let fullText = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    const chunk = decoder.decode(value);
    const lines = chunk.split('\n').filter(l => l.startsWith('data: '));
    for (const line of lines) {
      const data = JSON.parse(line.slice(6));
      if (data.text) {
        fullText += data.text;
        bubble.innerHTML = escapeHtml(fullText).replace(/\n/g, '<br>');
        container.scrollTop = container.scrollHeight;
      }
    }
  }

  bubble.removeAttribute('id');
  isStreaming = false;
  document.getElementById('sendBtn').disabled = false;
  input.focus();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
  // Auto-resize textarea
  e.target.style.height = '44px';
  e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
}

async function clearChat() {
  if (!currentPetId) return;
  if (!confirm('Clear all chat history for this pet?')) return;
  await fetch(`/api/pets/${currentPetId}/chat`, { method: 'DELETE' });
  await loadChatHistory(currentPetId);
}

// ── Modal ────────────────────────────────────────────────────────────────────
function openAddPet() {
  editingPetId = null;
  document.getElementById('modalTitle').textContent = 'Add Your Pet';
  clearForm();
  document.getElementById('petModal').classList.remove('hidden');
}

function editCurrentPet() {
  if (!currentPetId) return;
  const pet = pets.find(p => p.petId === currentPetId);
  editingPetId = currentPetId;
  document.getElementById('modalTitle').textContent = 'Edit ' + pet.name;
  document.getElementById('f-name').value = pet.name || '';
  document.getElementById('f-species').value = pet.species || 'Dog';
  document.getElementById('f-breed').value = pet.breed || '';
  document.getElementById('f-age').value = pet.age || '';
  document.getElementById('f-weight').value = pet.weight || '';
  document.getElementById('f-sex').value = pet.sex || '';
  document.getElementById('f-conditions').value = pet.conditions || '';
  document.getElementById('f-medications').value = pet.medications || '';
  document.getElementById('f-supplements').value = pet.supplements || '';
  document.getElementById('f-diet').value = pet.diet || '';
  document.getElementById('f-notes').value = pet.notes || '';
  document.getElementById('petModal').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('petModal').classList.add('hidden');
}

function clearForm() {
  ['f-name','f-breed','f-age','f-weight','f-conditions','f-medications','f-supplements','f-diet','f-notes'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-species').value = 'Dog';
  document.getElementById('f-sex').value = '';
}

async function savePet() {
  const name = document.getElementById('f-name').value.trim();
  const species = document.getElementById('f-species').value;
  if (!name) { alert('Please enter your pet\'s name'); return; }

  const data = {
    name, species,
    breed: document.getElementById('f-breed').value.trim(),
    age: document.getElementById('f-age').value.trim(),
    weight: document.getElementById('f-weight').value.trim(),
    sex: document.getElementById('f-sex').value,
    conditions: document.getElementById('f-conditions').value.trim(),
    medications: document.getElementById('f-medications').value.trim(),
    supplements: document.getElementById('f-supplements').value.trim(),
    diet: document.getElementById('f-diet').value.trim(),
    notes: document.getElementById('f-notes').value.trim(),
  };

  if (editingPetId) {
    await fetch(`/api/pets/${editingPetId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  } else {
    await fetch('/api/pets', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  }

  closeModal();
  await loadPets();
  if (!editingPetId) selectPet(pets[pets.length - 1].petId);
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Close modal on overlay click
document.getElementById('petModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

loadPets();
</script>
</body>
</html>
