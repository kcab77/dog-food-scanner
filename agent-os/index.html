<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agent OS — Command Center</title>
<style>
  :root {
    --bg: #07080c;
    --bg-soft: #0b0d13;
    --panel: rgba(255,255,255,0.035);
    --panel-2: rgba(255,255,255,0.07);
    --panel-solid: #12141b;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.15);
    --text: #f4f6fb;
    --muted: #8a93a4;
    --accent: #8b5cf6;
    --accent-2: #22d3ee;
    --warn: #fbbf24;
    --danger: #f87171;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); display: flex; min-height: 100vh;
    -webkit-font-smoothing: antialiased; letter-spacing: -0.011em; overflow-x: hidden;
  }
  /* Aurora background */
  .aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .aurora::before, .aurora::after { content:""; position:absolute; width:70vw; height:70vw; border-radius:50%; filter: blur(150px); opacity:.14; }
  .aurora::before { background: radial-gradient(circle, var(--accent), transparent 60%); top:-25vw; left:-10vw; animation: drift 30s ease-in-out infinite alternate; }
  .aurora::after  { background: radial-gradient(circle, var(--accent-2), transparent 60%); bottom:-30vw; right:-12vw; animation: drift 34s ease-in-out infinite alternate-reverse; }
  @keyframes drift { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(7vw,5vh) scale(1.12)} 100%{transform:translate(-5vw,-3vh) scale(.95)} }
  .grid-overlay { position: fixed; inset:0; z-index:0; pointer-events:none;
    background-image: linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px), linear-gradient(90deg, rgba(255,255,255,.022) 1px,transparent 1px);
    background-size: 40px 40px; -webkit-mask-image: radial-gradient(circle at 50% 25%, #000, transparent 75%); mask-image: radial-gradient(circle at 50% 25%, #000, transparent 75%); }
  /* Sidebar (glass) */
  .sidebar {
    width: 252px; background: rgba(9,10,15,0.72); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-right: 1px solid var(--border);
    padding: 18px 12px; display: flex; flex-direction: column; gap: 1px; position: sticky; top: 0; height: 100vh;
    z-index: 5; overflow-y: auto;
  }
  .brand-row { display:flex; align-items:center; gap:10px; padding: 4px 8px 14px; }
  .brand-logo { width:34px; height:34px; border-radius:10px; display:grid; place-items:center; font-size:17px;
    background: linear-gradient(140deg, var(--accent), var(--accent-2)); box-shadow: 0 6px 20px rgba(139,92,246,.4); }
  .brand { font-weight: 800; font-size: 17px; letter-spacing: -0.02em;
    background: linear-gradient(120deg, var(--accent), var(--accent-2)); -webkit-background-clip:text; background-clip:text; color: transparent; }
  .brand-sub { font-size:10px; letter-spacing:1.6px; color: var(--muted); margin-top:1px; }
  .nav-group { margin-top: 11px; }
  .nav-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); font-weight: 700; padding: 4px 10px 5px; opacity:.65; }
  .nav-btn {
    width: 100%; text-align: left; background: none; border: none; color: #c2cad6; padding: 7px 10px;
    border-radius: 10px; cursor: pointer; font-size: 13.5px; display: flex; align-items: center; gap: 11px;
    position: relative; transition: background .15s, color .15s;
  }
  .nav-btn .av, .nav-btn .ico { width: 26px; height: 26px; border-radius: 8px; display:grid; place-items:center; font-size: 14px; flex-shrink:0;
    background: color-mix(in srgb, var(--c, var(--accent)) 18%, transparent);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c, var(--accent)) 38%, transparent); }
  .nav-btn:hover { background: var(--panel-2); color: var(--text); }
  .nav-btn.active { background: var(--panel-2); color: #fff; font-weight: 600; }
  .nav-btn.active::before { content:""; position:absolute; left:-12px; top:50%; transform:translateY(-50%); width:3px; height:20px; border-radius:3px; background: var(--c, var(--accent)); box-shadow: 0 0 10px var(--c, var(--accent)); }
  .sidebar .spacer { flex: 1; min-height: 12px; }
  .io-row { display: flex; gap: 6px; padding: 0 2px; }
  .io-row button { flex: 1; font-size: 12px; padding: 8px; }
  /* Content + topbar */
  .content { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; z-index: 1; }
  .topbar { display:flex; justify-content:flex-end; gap:10px; padding: 14px 36px 0; }
  .chip { display:inline-flex; align-items:center; gap:7px; font-size:12px; color: var(--muted); background: var(--panel); border:1px solid var(--border); padding:7px 12px; border-radius:10px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .chip kbd { font-family: ui-monospace, monospace; background: var(--panel-2); border:1px solid var(--border); border-radius:5px; padding:0 5px; font-size:11px; color: var(--text); }
  .chip .bars { display:inline-flex; gap:2px; align-items:flex-end; height:11px; }
  .chip .bars i { width:3px; border-radius:2px; display:block; }
  /* Main */
  .main { padding: 16px 36px 44px; max-width: 1200px; width: 100%; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .sub { color: var(--muted); margin-bottom: 24px; font-size: 14px; }
  .grid { display: grid; gap: 16px; }
  .cards-3 { grid-template-columns: repeat(3, 1fr); }
  .cards-4 { grid-template-columns: repeat(4, 1fr); }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
  }
  .stat { font-size: 30px; font-weight: 800; }
  .stat-label { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin: 26px 0 12px; }
  .section-head h2 { font-size: 18px; margin: 0; }
  button {
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border: none; padding: 9px 15px; border-radius: 10px;
    font-weight: 600; cursor: pointer; font-size: 13px; box-shadow: 0 4px 16px rgba(139,92,246,.32);
  }
  button:hover { filter: brightness(1.08); }
  button.ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  button.danger { background: transparent; color: var(--danger); border: 1px solid transparent; padding: 4px 8px; }
  button.danger:hover { border-color: var(--danger); }
  .item {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
    margin-bottom: 10px; display: flex; align-items: flex-start; gap: 12px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .item .body { flex: 1; }
  .item .title { font-weight: 600; }
  .item .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .pill { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 20px; font-weight: 600; }
  .pill.green { background: rgba(76,195,138,.15); color: var(--accent); }
  .pill.blue { background: rgba(47,129,247,.15); color: var(--accent-2); }
  .pill.yellow { background: rgba(227,179,65,.15); color: var(--warn); }
  .pill.gray { background: rgba(139,151,167,.15); color: var(--muted); }
  .pill.red { background: rgba(248,81,73,.15); color: var(--danger); }
  input, select, textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 10px 12px; border-radius: 8px; font-size: 14px; font-family: inherit;
  }
  textarea { resize: vertical; min-height: 70px; }
  .row { display: flex; gap: 10px; margin-bottom: 10px; }
  .row > * { flex: 1; }
  .chk { width: 18px; height: 18px; margin-top: 2px; cursor: pointer; accent-color: var(--accent); }
  .done .title { text-decoration: line-through; color: var(--muted); }
  .empty { color: var(--muted); font-style: italic; padding: 20px 0; }
  .hidden { display: none; }
  /* Modal */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 50;
  }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 22px; width: 480px; max-width: 92vw; max-height: 86vh; overflow-y: auto;
  }
  .modal h3 { margin: 0 0 16px; }
  .modal label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 5px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  .agent-prompt { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .copy-btn { font-size: 11px; padding: 5px 10px; }
  .kanban { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .col-head { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 10px; font-weight: 700; }
  .kanban .item { flex-direction: column; cursor: grab; }
  .progress { height: 6px; background: var(--panel-2); border-radius: 6px; overflow: hidden; margin-top: 10px; }
  .progress > div { height: 100%; background: var(--accent); }
  /* Brain (Obsidian) viewer */
  .brain-wrap { display: grid; grid-template-columns: 230px 1fr; gap: 18px; align-items: start; }
  .brain-side { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; position: sticky; top: 20px; max-height: calc(100vh - 60px); overflow:auto; }
  .brain-group { margin-bottom: 12px; }
  .brain-group-title { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 700; padding: 4px 8px; }
  .brain-link { display: block; width: 100%; text-align: left; background: none; border: none; color: var(--muted); padding: 6px 8px; border-radius: 7px; cursor: pointer; font-size: 13px; }
  .brain-link:hover { background: var(--panel-2); color: var(--text); }
  .brain-link.active { background: var(--panel-2); color: var(--accent); font-weight: 600; }
  .brain-doc { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 26px 30px; max-height: calc(100vh - 60px); overflow:auto; line-height: 1.6; }
  .brain-doc h1 { margin: 0 0 14px; }
  .brain-doc h2 { margin: 22px 0 10px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .brain-doc h3 { margin: 18px 0 8px; color: var(--text); }
  .brain-doc p { margin: 10px 0; }
  .brain-doc ul, .brain-doc ol { margin: 10px 0; padding-left: 22px; }
  .brain-doc li { margin: 4px 0; }
  .brain-doc code { background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; font-family: ui-monospace, monospace; font-size: 12px; }
  .brain-doc pre.codeblock { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow:auto; font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); }
  .brain-doc blockquote { border-left: 3px solid var(--accent-2); margin: 10px 0; padding: 6px 14px; color: var(--muted); background: var(--panel-2); border-radius: 0 8px 8px 0; }
  .brain-doc table { border-collapse: collapse; margin: 12px 0; width: 100%; font-size: 13px; }
  .brain-doc th, .brain-doc td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; }
  .brain-doc th { background: var(--panel-2); }
  .brain-doc hr { border: none; border-top: 1px solid var(--border); margin: 18px 0; }
  .brain-doc a { color: var(--accent-2); text-decoration: none; }
  .brain-doc a.wl { color: var(--accent); border-bottom: 1px dotted var(--accent); }
  .brain-doc a.wl:hover, .brain-doc a:hover { text-decoration: underline; }
  .brain-doc .wl-missing { color: var(--muted); border-bottom: 1px dotted var(--muted); }
  /* Voice input row */
  .voice-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .voice-row input, .voice-row textarea { flex: 1; }
  button.mic { flex: 0 0 auto; font-size: 15px; padding: 9px 12px; }
  button.mic.listening { background: var(--accent); color: #062; animation: micpulse 1s infinite; }
  @keyframes micpulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
  /* App Store stats */
  .as-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 8px 0 18px; }
  .as-stat { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .as-stat .n { font-size: 28px; font-weight: 700; line-height: 1; }
  .as-stat .l { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .as-chart { display: flex; align-items: flex-end; gap: 4px; height: 170px; padding: 14px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; }
  .as-bar { flex: 1; min-width: 3px; background: linear-gradient(180deg, var(--accent), rgba(76,195,138,.2)); border-radius: 4px 4px 0 0; position: relative; }
  .as-bar:hover { filter: brightness(1.25); }
  .as-bar .tip { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 3px 7px; font-size: 11px; white-space: nowrap; display: none; margin-bottom: 5px; z-index: 2; }
  .as-bar:hover .tip { display: block; }
  .setup-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 22px 24px; max-width: 720px; }
  .setup-card ol { padding-left: 20px; line-height: 1.8; margin: 10px 0; }
  .setup-card pre { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; overflow: auto; font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); }
  .setup-card code { background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; font-family: ui-monospace, monospace; font-size: 12px; }
  /* Hermes chat */
  .chat-msgs { display: flex; flex-direction: column; gap: 10px; padding: 6px 2px 14px; min-height: 240px; max-height: calc(100vh - 230px); overflow-y: auto; }
  .bubble { max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .bubble.user { align-self: flex-end; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border-bottom-right-radius: 4px; }
  .bubble.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .bubble.err { align-self: flex-start; background: rgba(220,80,80,.12); border: 1px solid rgba(220,80,80,.3); color: #f1a9a9; }
  .bubble .who { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; opacity: .6; margin-bottom: 3px; }
  .typing-bubble { align-self: flex-start; color: var(--muted); font-size: 13px; padding: 8px 14px; }
</style>
</head>

  <div class="aurora"></div>
  <div class="grid-overlay"></div>
  <aside class="sidebar">
    <div class="brand-row">
      <div class="brand-logo">◎</div>

        <div class="brand">Agentic OS</div>

    <div class="io-row">
      <button class="ghost" id="exportBtn">Export</button>
      <button class="ghost" id="importBtn">Import</button>

  <div class="content">
    <div class="topbar">
      <span class="chip"><kbd>⌘K</kbd> Command palette</span>
      <span class="chip"><span class="bars"><i style="height:5px;background:var(--accent)"></i><i style="height:8px;background:var(--accent-2)"></i><i style="height:11px;background:#34d399"></i></span> ALL SYSTEMS</span>
    </div>
    <main class="main" id="main"></main>

  <div id="modalRoot"></div>

<script>
// ─────────────────────────────────────────────────────────────────────────
// Agent OS — single-file local command center. All data lives in localStorage.

const STORE_KEY = "agent_os_data_v1";

const SEED = {
  projects: [

  ],

    { id: uid(), title: "Deploy Pet Store Agent to Railway", project: "PetChat / Pet Store Agent (SaaS)", done: false, priority: "high" },
    { id: uid(), title: "Send follow-up email to pet store (chat-hours objection)", project: "PetChat / Pet Store Agent (SaaS)", done: false, priority: "med" },
  ],
  content: [
    { id: uid(), title: "Why omega-6:3 ratio matters in kibble", keyword: "dog food omega ratio", stage: "idea" },
    { id: uid(), title: "Menadione (Vitamin K3) — is it safe for dogs?", keyword: "menadione dog food", stage: "draft" },
    { id: uid(), title: "Freeze-dried vs gently cooked dog food", keyword: "freeze dried vs gently cooked", stage: "written" },
    { id: uid(), title: "Natural flea & tick prevention that actually works", keyword: "natural flea tick prevention dogs", stage: "published" },
  ],
  agents: [
    { id: uid(), name: "Keyword Researcher", desc: "Finds SEO keyword clusters for a topic.", prompt: "You are an SEO keyword researcher for a holistic dog-nutrition brand (Common Sense Dog).\nTopic: {{TOPIC}}\n\nReturn 10 keyword opportunities as a table: keyword | search intent | difficulty (low/med/high) | why it fits our holistic, whole-food-first philosophy. Prioritize low-competition long-tail terms a dog owner would actually search." },
    { id: uid(), name: "Article Outliner", desc: "Turns a keyword into a structured blog outline.", prompt: "You are a content strategist for Common Sense Dog (holistic, nutrition-first dog health).\nTarget keyword: {{KEYWORD}}\n\nProduce a blog outline: SEO title (<60 chars), meta description (<155 chars), H2/H3 structure, and 1-line note per section on what to cover. Voice: knowledgeable dog owner helping another, evidence-based holistic, never defaults to 'consult your vet'." },
    { id: uid(), name: "Article Writer", desc: "Writes the full article in brand voice.", prompt: "You are the Common Sense Dog writer. Write a complete blog article from this outline:\n{{OUTLINE}}\n\nVoice: holistic, whole-food-first, channels Dr. Judy Morgan / Dr. Karen Becker / Dr. Marty Goldstein. Direct, specific, actionable. Cite mechanisms (inflammation, omega ratios, processing). 1200–1600 words. End with a practical takeaway." },
    { id: uid(), name: "Internal Linker", desc: "Suggests internal links to existing posts.", prompt: "Given this new article:\n{{ARTICLE}}\n\nAnd this list of existing posts:\n{{EXISTING_POSTS}}\n\nSuggest 3–5 internal links: anchor text + which post to link to + where in the article. Natural placement only." },

function uid() { return Math.random().toString(36).slice(2, 10); }
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) { save(SEED); return structuredClone(SEED); }
    return JSON.parse(raw);
  } catch { return structuredClone(SEED); }
}
function save(d) { localStorage.setItem(STORE_KEY, JSON.stringify(d)); }

    <div id="runOut" style="margin-top:14px"></div>

    root.querySelectorAll("[data-var]").forEach(t => { prompt = prompt.replaceAll(`{{${t.dataset.var}}}`, t.value).replace(new RegExp(`{{\\s*${t.dataset.var}\\s*}}`,'g'), t.value); });
    const out = document.getElementById("runOut");
    out.innerHTML = `<div class="empty">Running Claude… (this costs API tokens)</div>`;
    try {
      const r = await api("/api/run-agent", { prompt });
      if (r.error) { out.innerHTML = `<div class="pill red">Error</div><div class="agent-prompt">${esc(r.error)}</div>`; return; }
      window._lastRun = { title: a.name + " output", text: r.text };
      out.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <strong>Output</strong>

            <button class="copy-btn" id="rCopy">Copy</button>

        <div class="agent-prompt" style="max-height:340px;overflow:auto">${esc(r.text)}</div>`;
      document.getElementById("rCopy").onclick = () => navigator.clipboard.writeText(r.text);
      document.getElementById("rDraft").onclick = async () => {

  };
}

// ── Voice input (browser SpeechRecognition — no keys, Chrome/Edge) ───────────
let _recog = null;
function startVoice(targetId, btn) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert("Voice input needs Chrome or Edge (uses the browser's built-in speech recognition)."); return; }
  if (_recog) { _recog.stop(); _recog = null; btn.classList.remove("listening"); return; }
  const el = document.getElementById(targetId);
  const base = el.value ? el.value.replace(/\s*$/, "") + " " : "";
  let finalText = "";
  const r = new SR();
  r.lang = "en-US"; r.interimResults = true; r.continuous = true;
  r.onresult = (ev) => {
    let interim = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const t = ev.results[i][0].transcript;
      if (ev.results[i].isFinal) finalText += t + " "; else interim += t;
    }
    el.value = base + finalText + interim;
  };
  r.onend = () => { _recog = null; btn.classList.remove("listening"); };
  r.onerror = () => { _recog = null; btn.classList.remove("listening"); };
  r.start(); _recog = r; btn.classList.add("listening");
}

// Tiny markdown → HTML (headings, bold, code, links, [[wikilinks]], lists, tables, quotes, fences)
function mdToHtml(md, name2path) {
  const e = s => s.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
  const inline = s => {
    s = e(s);
    s = s.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, name, alias) => {
      const label = (alias || name).trim();
      const p = name2path[name.trim().toLowerCase()];
      return p ? `<a href="#" class="wl" data-note="${esc(p)}">${esc(label)}</a>`
               : `<span class="wl-missing">${esc(label)}</span>`;
    });
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return s;
  };
  const lines = md.replace(/\r/g, '').split('\n');
  let i = 0, html = '', inList = false, listTag = '';
  const closeList = () => { if (inList) { html += `</${listTag}>`; inList = false; } };
  if (lines[0] === '---') { let j = 1; while (j < lines.length && lines[j] !== '---') j++; i = j + 1; }
  for (; i < lines.length; i++) {
    let line = lines[i];
    if (/^```/.test(line)) { closeList(); let code = ''; i++; while (i < lines.length && !/^```/.test(lines[i])) code += lines[i++] + '\n'; html += `<pre class="codeblock">${e(code)}</pre>`; continue; }
    if (/^\s*$/.test(line)) { closeList(); continue; }
    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      closeList();
      const head = line.trim().replace(/^\||\|$/g, '').split('|').map(c => `<th>${inline(c.trim())}</th>`).join('');
      let t = `<table><thead><tr>${head}</tr></thead><tbody>`;
      i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
        t += `<tr>${lines[i].trim().replace(/^\||\|$/g, '').split('|').map(c => `<td>${inline(c.trim())}</td>`).join('')}</tr>`; i++;
      }
      i--; html += t + '</tbody></table>'; continue;
    }
    let m;
    if ((m = line.match(/^(#{1,6})\s+(.*)/))) { closeList(); html += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; continue; }
    if (/^\s*>\s?/.test(line)) { closeList(); html += `<blockquote>${inline(line.replace(/^\s*>\s?/, ''))}</blockquote>`; continue; }
    if (/^\s*---+\s*$/.test(line)) { closeList(); html += '<hr>'; continue; }
    if (/^\s*[-*]\s+/.test(line)) {
      if (!inList || listTag !== 'ul') { closeList(); html += '<ul>'; inList = true; listTag = 'ul'; }
      html += `<li>${inline(line.replace(/^\s*[-*]\s+(\[[ x~]\]\s*)?/, ''))}</li>`; continue;
    }
    if (/^\s*\d+\.\s+/.test(line)) {
      if (!inList || listTag !== 'ol') { closeList(); html += '<ol>'; inList = true; listTag = 'ol'; }
      html += `<li>${inline(line.replace(/^\s*\d+\.\s+/, ''))}</li>`; continue;
    }
    closeList();
    html += `<p>${inline(line)}</p>`;
  }
  closeList();
  return html;
}

// ── Helpers ────────────────────────────────────────────────────────────────
function esc(s){ return String(s??"").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function persist(){ save(data); render(); }
// Talk to the local backend. Throws if the server isn't running (static mode).
async function api(path, payload){
  const opt = payload ? { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload) } : {};
  const r = await fetch(path, opt);
  if (!r.ok) throw new Error("api "+r.status);
  return r.json();
}

document.querySelectorAll(".nav-btn").forEach(b => b.onclick = () => { view = b.dataset.view; render(); });
document.getElementById("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `agent-os-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
};
document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();
document.getElementById("importFile").onchange = (e) => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { try { data = JSON.parse(r.result); persist(); alert("Imported."); } catch { alert("Invalid file."); } };
  r.readAsText(f);
};

render();
</script>
</body>
</html>
