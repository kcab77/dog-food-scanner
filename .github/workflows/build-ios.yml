name: Build iOS

# ⚠️ MANUAL ONLY — do not put `push:` back without fixing the job first.
#
# This ran on every push to main from May 2026 and failed every single time,
# dying in 1-2 minutes before it reached the build. Over one week in August it
# generated 15 failure emails. It has never produced an artifact.
#
# It also duplicates what actually ships PawGrade, which is run by hand:
#   EAS_NO_VCS=1 eas build -p ios --profile production
#
# To make it work again you'd need four repo secrets present and current:
# EXPO_TOKEN, DISTRIBUTION_CERTIFICATE_P12, DISTRIBUTION_CERTIFICATE_PASSWORD,
# PROVISIONING_PROFILE. iOS distribution certificates expire annually, so the
# May ones may simply be dead.
#
# Left in place rather than deleted so the setup isn't lost if CI is ever
# wanted. Trigger it from the Actions tab when you want to try.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Import certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DISTRIBUTION_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Import provisioning profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo $PROVISIONING_PROFILE | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Build iOS
        run: eas build --platform ios --profile production --local --non-interactive

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: pawgrade-ios
          path: "*.ipa"
